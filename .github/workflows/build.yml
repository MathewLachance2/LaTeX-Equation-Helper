name: Build LaTeX Helper

on:
  push:
    branches: [ "main", "master", "git-action-testing" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master", "git-action-testing" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller LaTeXHelper.spec

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/LaTeXHelper.exe
          README.md
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        body: |
          ## 🚀 Quick Start
          1.  **Download** the `LaTeXHelper.exe` below.
          2.  **Run** the file. (See note below if your browser warns you).
          3.  Press **`Ctrl + Alt + E`** anywhere to start typing math!
          
          ---
          *Note: This is a standalone portable executable. No installation required.*


    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeXHelper-Executable
        path: dist/LaTeXHelper.exe
